services:
  postgres:
    image: postgres:17-alpine
    container_name: campuscode-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-campuscode}
      POSTGRES_USER: ${POSTGRES_USER:-campuscode}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-campuscode_dev_only}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - campuscode_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-campuscode} -d ${POSTGRES_DB:-campuscode}"]
      interval: 10s
      timeout: 5s
      retries: 10

  cognee:
    image: cognee/cognee:1.6.5
    container_name: campuscode-cognee
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      ENV: local
      LLM_PROVIDER: gemini
      LLM_MODEL: gemini/gemini-3.5-flash-lite
      LLM_API_KEY: ${GEMINI_API_KEY:-}
      EMBEDDING_PROVIDER: fastembed
      EMBEDDING_MODEL: BAAI/bge-small-en-v1.5
      EMBEDDING_DIMENSIONS: "384"
      GRAPH_DATABASE_PROVIDER: kuzu
      VECTOR_DB_PROVIDER: lancedb
      DATA_ROOT_DIRECTORY: /cognee-storage/data
      SYSTEM_ROOT_DIRECTORY: /cognee-storage/system
      ENABLE_BACKEND_ACCESS_CONTROL: "false"
      ALLOW_HTTP_REQUESTS: "true"
      # GitHub repository ingestion clones source into Cognee-managed local files.
      # Keep the Cognee port bound to localhost when enabling this for development.
      ACCEPT_LOCAL_FILE_PATH: "true"
      DEFAULT_USER_PASSWORD: ${DEFAULT_USER_PASSWORD:-default_password}
    volumes:
      - cognee_storage:/cognee-storage
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 60s

  cognee-ui:
    image: cognee/cognee-ui:${COGNEE_UI_TAG:-latest}
    container_name: campuscode-cognee-ui
    restart: unless-stopped
    profiles:
      - ui
    environment:
      # Leave empty so the browser derives the API URL from localhost:3000.
      COGNEE_BACKEND_URL: ${COGNEE_BACKEND_URL:-}
      DEFAULT_USER_PASSWORD: ${DEFAULT_USER_PASSWORD:-default_password}
    depends_on:
      cognee:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:3000"

  mailpit:
    image: axllent/mailpit:latest
    container_name: campuscode-mailpit
    restart: unless-stopped
    profiles:
      - mail
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"

volumes:
  cognee_storage:
  campuscode_postgres:
